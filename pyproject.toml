[build-system]
requires	= ["setuptools>=70.0"]
build-backend	= "setuptools.build_meta"

[project]
name	= "ComfyUI-outputlists_combiner"
version	= "0.0.19"
description	= """Multi-prompt, multi image generation & video batch processing in a single run to sequentially process multiple assets at once!
Includes the only clean correct and customizable XY grid plots for ComfyUI based on data lists. Works with every workflow. XY images XYZ super grid plots & video grids for Minimax H3 WAN LTX & Hunyuan 3D
Generator for multiple prompt lists & text combinations to combine prompts & resolutions variants + ChatGPT Claude LLM
Inspect combo tool to retrieve a list of models. Combine LoRA models strength & trigger words
Compare samplers & schedulers of Flux Krea Zit Turbo
Spreadsheets for batch processing (Microsoft Office Excel LibreOffice Calc CSV TSV markdown tables)
Load any file from disk (plaintext base64 binary jsonpath http api) directory listing & path glob patterns, load video file & metadata
Iterator nodes to foreach lists simpler than for-loops & while-loops for efficiency
Integrates well with essentials like Crystools ImpactPack KJNodes EasyUse tinyterra"""

authors	= [{name = "Gerold Meisinger"}]
readme	= "README.md"
license	= { text="GNU General Public License v3" }
requires-python	= ">=3.10"
classifiers	= []
dependencies	= ["nums-from-string", "fastnumbers", "jsonpath_ng", "pandas", "odfpy", "openpyxl", "xlrd", "pyxlsb", "chardet", "skia-python", "pyexiftool", "deepdiff"]

[project.optional-dependencies]
dev = [
	"bump-my-version"	,
	"coverage"	, # testing
	"mypy"	, # linting
	"pre-commit"	, # runs linting on commit
	"pytest"	, # testing
	"ruff"	, # linting
]

[project.urls]
Repository	= "https://github.com/geroldmeisinger/ComfyUI-outputlists-combiner"
BugTracker	= "https://github.com/geroldmeisinger/ComfyUI-outputlists-combiner/issues"
Documentation	= "https://github.com/geroldmeisinger/ComfyUI-outputlists-combiner/wiki"

[tool.comfy]
PublisherId	= "geroldmeisinger"
DisplayName	= "OutputLists Combiner"
Icon	= "https://raw.githubusercontent.com/geroldmeisinger/ComfyUI-outputlists-combiner/refs/heads/main/logo.png"
Tags	= []
Repository	= "https://github.com/geroldmeisinger/ComfyUI-outputlists-combiner"
includes	= []

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
minversion	= "8.0"
testpaths	= ["tests",]

[tool.mypy]
files = "."

# Use strict defaults
strict	= true
warn_unreachable	= true
warn_no_return	= true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module	= "tests.*"
allow_untyped_defs	= true
disable_error_code	= "attr-defined"

[tool.ruff]
# extend-exclude	= ["static", "ci/templates"]
line-length	= 140
src	= ["src"] #, "tests"]
target-version	= "py39"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
	"S102"	, # exec-builtin
	"S307"	, # eval-used
	"W293"	,
	"F"	, # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
	# See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
